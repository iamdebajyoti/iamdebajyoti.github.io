<script>
    
    
    var todayy = new Date();
    var today = moment(todayy).tz("Asia/Kolkata");
    
    document.getElementById("curDate").innerHTML = today.format("dddd, YYYY-MM-DD");


    var todaynow1 = todayy.toDateString();
    var todaynow2 = todayy.toISOString().split("T")[0];
    var todaynow3 = todayy.toJSON();
    var todaynow4 = todayy.toLocaleDateString();
    var todaynow5 = todayy.toLocaleString();
    var todaynow6 = todayy.toLocaleTimeString();
    var todaynow7 = todayy.toString();
    var todaynow8 = todayy.toTimeString();
    var todaynow9 = todayy.toUTCString();
    
    document.getElementById("curDate1").innerHTML = todaynow1;
    document.getElementById("curDate2").innerHTML = todaynow2;
    document.getElementById("curDate3").innerHTML = todaynow3;
    document.getElementById("curDate4").innerHTML = todaynow4;
    document.getElementById("curDate5").innerHTML = todaynow5;
    document.getElementById("curDate6").innerHTML = todaynow6;
    document.getElementById("curDate7").innerHTML = todaynow7;
